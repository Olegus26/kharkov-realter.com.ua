  <script>
    (function() {
      var seasons = ['winter', 'spring', 'summer', 'autumn'];
      var param = new URLSearchParams(location.search).get('season');
      param = param ? param.toLowerCase() : '';
      var season = seasons.indexOf(param) !== -1 ? param : '';
      if (!season) {
        var m = new Date().getMonth();
        season = (m === 11 || m === 0 || m === 1) ? 'winter' : (m >= 2 && m <= 4) ? 'spring' : (m >= 5 && m <= 7) ? 'summer' : 'autumn';
      }
      if (season === 'winter') {
        var fav = document.querySelector('link[rel="icon"]');
        if (fav) fav.href = '/images/brand/logo-winter.png';
      }
      var p = location.pathname.replace(/\/+$/, '') || '/';
      var isMobile = window.innerWidth <= 767;
      var href = '';
      if (p === '/') {
        href = '/images/backgrounds/hero-' + season + (isMobile ? '-mobile.webp' : '.webp');
      } else if (p === '/o-korporatcii') {
        href = '/images/backgrounds/about-' + season + (isMobile ? '-mobile.webp' : '.webp');
      }
      if (href) {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = href;
        l.fetchPriority = 'high';
        document.head.appendChild(l);
      }
    })();
  </script>
